name: Context Demo
on: workflow_dispatch
env:
  workflow-level: daniel
  website: mindfulstack.se

jobs:
  print-some-stuff:
    runs-on: ubuntu-latest
    env:
      job-level: ruben

    strategy:
      matrix:
        colour: [red, blue, green]
        name: [Daniel, Ruben, Demelza]
    steps:
      - name: setup another env var
        env:
          secret: 42
        run: |
          echo "with gh expression syntax: ${{ env.secret }}"
          echo "with pure bash: $secret"
    
      - name: print some stuff
        env:
          this-step: demelza
        run: |
          echo "Hello world, from our workflow"
          echo "Our env is: ${{ toJson(env) }}"
          echo "Our vars is: ${{ toJson(vars) }}"
      
      - name: matrix time
        run: |
          echo "Our matrix is: ${{ toJson(matrix) }}"
          echo "${{ matrix.name}}s favourite color is ${{ matrix.colour}}"
      
          
  
