name: Secrets Demo

on:
  workflow_dispatch:

jobs:
  repo-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Print the secret on purpose
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: echo "The key is $API_KEY"

      - name: Masking is a plain text match
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }} 

        run: |
          echo "Whole value: $API_KEY"
          echo "First part: ${API_KEY:0:8}"
          echo "Reversed: $(echo -n "$API_KEY" | rev)"
          echo "Base64: $(echo -n "$API_KEY" | base64)"
          echo "Spaced out:  $(echo -n "$API_KEY" | sed 's/./& /g')" # sed puts a space after every character

      - name: Structured data leaks when it is reshaped
        env:
          CONFIG: ${{ secrets.DEMO_CONFIG }}
        run: |
          echo "Raw: $CONFIG"
          echo "Password: $(echo "$CONFIG" | jq -r .password)"

  environment-secret:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Which value did the job get
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: echo "Value starts with $(echo -n "$API_KEY" | cut -c1-4)"

  no-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Which value did the job get
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: echo "Value starts with $(echo -n "$API_KEY" | cut -c1-4)"
  









          
